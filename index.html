<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsightED — Redirecting...</title>
  <meta http-equiv="refresh" content="1; url=https://insightedsyd.netlify.app" />
  <link rel="canonical" href="https://insightedsyd.netlify.app" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #334155;
    }
    .box {
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 16px;
      border: 4px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Redirecting you to <a href="https://insightedsyd.netlify.app">InsightED</a>...</p>
  </div>
  <script>
    setTimeout(function () {
      window.location.replace("https://insightedsyd.netlify.app");
    }, 1000);
  </script>
</body>
</html>
