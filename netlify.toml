[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the Node version used by the GitHub Pages workflow
  NODE_VERSION = "20"

# Single-page app: every path must serve index.html so React Router can
# handle it. Without this, refreshing /app/students returns a real 404.
# Status 200 (not 301) so the URL stays put and the status code is honest.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite fingerprints filenames, so built assets can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
